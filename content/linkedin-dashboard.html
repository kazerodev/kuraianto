<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f0f0f;
    --surface:  #1a1a1a;
    --border:   #2a2a2a;
    --orange:   #f97316;
    --orange2:  #ea580c;
    --white:    #f1f5f9;
    --muted:    #64748b;
    --green:    #22c55e;
    --yellow:   #eab308;
    --red:      #ef4444;
    --radius:   10px;
    --font:     'Segoe UI', system-ui, sans-serif;
  }

  body { background: var(--bg); color: var(--white); font-family: var(--font); font-size: 14px; line-height: 1.6; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--white);
  }
  header .logo span { color: var(--orange); }
  header small { color: var(--muted); margin-left: 4px; font-size: 12px; }

  .controls {
    padding: 16px 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  select, input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--white);
    padding: 6px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    outline: none;
  }
  select:focus, input:focus { border-color: var(--orange); }

  .stat-bar {
    display: flex;
    gap: 16px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat .num { font-weight: 700; color: var(--white); }
  .stat .dot { width: 8px; height: 8px; border-radius: 50%; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 16px;
    padding: 20px 24px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #3a3a3a; }
  .card.reviewed { border-left: 3px solid var(--green); }
  .card.scheduled { border-left: 3px solid var(--yellow); }
  .card.published { border-left: 3px solid var(--orange); opacity: 0.6; }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .card-date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card-day  { font-size: 11px; color: var(--muted); }

  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 600;
  }

  .badge-format-short-educational { color: #60a5fa; border-color: #1e40af; background: #1e3a5f22; }
  .badge-format-story              { color: #c084fc; border-color: #6b21a8; background: #4a1d7622; }
  .badge-format-mistake            { color: #f87171; border-color: #991b1b; background: #7f1d1d22; }
  .badge-format-checklist          { color: #4ade80; border-color: #166534; background: #14532d22; }
  .badge-format-opinion            { color: #fbbf24; border-color: #92400e; background: #78350f22; }
  .badge-format-soft-sales         { color: var(--orange); border-color: var(--orange2); background: #7c2d1222; }

  .badge-status-draft      { color: var(--muted); border-color: #374151; background: transparent; }
  .badge-status-reviewed   { color: var(--green); border-color: #166534; background: #14532d22; }
  .badge-status-scheduled  { color: var(--yellow); border-color: #854d0e; background: #713f1222; }
  .badge-status-published  { color: var(--orange); border-color: var(--orange2); background: #7c2d1222; }

  .hook {
    font-size: 14px;
    font-weight: 600;
    color: var(--white);
    line-height: 1.4;
  }

  .category { font-size: 12px; color: var(--muted); }

  .body-preview {
    font-size: 13px;
    color: #94a3b8;
    white-space: pre-wrap;
    max-height: 100px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    line-height: 1.5;
  }
  .body-preview.expanded { max-height: none; }
  .body-preview::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30px;
    background: linear-gradient(transparent, var(--surface));
    pointer-events: none;
  }
  .body-preview.expanded::after { display: none; }

  .cta-line {
    font-size: 12px;
    color: var(--orange);
    font-style: italic;
    padding-top: 4px;
    border-top: 1px solid var(--border);
  }

  .hashtags { font-size: 12px; color: #60a5fa; }

  .actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding-top: 4px;
  }

  button {
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--white);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    transition: background 0.1s, border-color 0.1s;
  }
  button:hover { background: #2a2a2a; border-color: #404040; }

  .btn-copy    { color: #94a3b8; }
  .btn-tags    { color: #60a5fa; border-color: #1e3a5f; }
  .btn-review  { color: var(--green); border-color: #166534; }
  .btn-sched   { color: var(--yellow); border-color: #854d0e; }
  .btn-pub     { color: var(--orange); border-color: var(--orange2); }
  .btn-reset   { color: var(--muted); border-color: #374151; }

  .note-input {
    width: 100%;
    background: #111;
    border: 1px solid var(--border);
    color: #94a3b8;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--font);
    resize: vertical;
    min-height: 36px;
  }
  .note-input:focus { outline: none; border-color: var(--orange); color: var(--white); }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1e3a2f;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.2s, transform 0.2s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; padding: 12px; }
    .controls { padding: 12px; }
  }
</style>

// ── State (persisted in localStorage) ────────────────────────────────────────
const STATE_KEY = 'kuraianto_li_state';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY) || '{}'); }
  catch { return {}; }
}

function saveState(s) {
  localStorage.setItem(STATE_KEY, JSON.stringify(s));
}

let state = loadState();

function getPostState(i) {
  return state[i] || { status: 'Draft', note: '' };
}

function setPostField(i, field, value) {
  if (!state[i]) state[i] = { status: 'Draft', note: '' };
  state[i][field] = value;
  saveState(state);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Copy helper ───────────────────────────────────────────────────────────────
function copyText(text, label) {
  navigator.clipboard.writeText(text).then(() => showToast(`Copiado: ${label}`));
}

// ── Build LinkedIn-ready post text ────────────────────────────────────────────
function buildPostText(p) {
  return `${p.hook}\n\n${p.body}\n\n${p.cta}\n\n${p.hashtags}`;
}

// ── Render stats ──────────────────────────────────────────────────────────────
function renderStats(filtered) {
  const counts = { Draft: 0, Reviewed: 0, Scheduled: 0, Published: 0 };
  POSTS.forEach((_, i) => { counts[getPostState(i).status]++; });
  const colors = { Draft: '#64748b', Reviewed: '#22c55e', Scheduled: '#eab308', Published: '#f97316' };
  const bar = document.getElementById('statBar');
  bar.innerHTML = `
    <div class="stat"><span class="num">${POSTS.length}</span> posts totales</div>
    <div class="stat"><span class="num">${filtered.length}</span> visibles</div>
    ${Object.entries(counts).map(([s, n]) =>
      `<div class="stat"><span class="dot" style="background:${colors[s]}"></span>${s}: <span class="num">${n}</span></div>`
    ).join('')}
  `;
}

// ── Render cards ──────────────────────────────────────────────────────────────
function renderGrid(filtered) {
  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = '<p style="color:var(--muted);padding:20px">No hay posts con estos filtros.</p>';
    return;
  }

  grid.innerHTML = filtered.map(({ p, i }) => {
    const ps = getPostState(i);
    const statusClass = ps.status.toLowerCase();
    const fmtClass    = `badge-format-${p.format}`;
    const stClass     = `badge-status-${statusClass}`;
    const d = new Date(p.date + 'T00:00:00');
    const days = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

    return `
    <div class="card ${statusClass}" id="card-${i}">
      <div class="card-header">
        <div>
          <div class="card-date">${p.date} <span class="card-day">${days[d.getDay()]}</span></div>
          <div class="category">${p.category}</div>
        </div>
        <div style="display:flex;gap:5px;flex-direction:column;align-items:flex-end">
          <span class="badge ${fmtClass}">${p.format.replace('-', ' ')}</span>
          <span class="badge ${stClass}" id="badge-status-${i}">${ps.status}</span>
        </div>
      </div>

      <div class="hook">${escHtml(p.hook)}</div>

      <div class="body-preview" id="body-${i}" onclick="toggleExpand(${i})">${escHtml(p.body)}</div>

      <div class="cta-line">${escHtml(p.cta)}</div>

      <div class="hashtags">${escHtml(p.hashtags)}</div>

      <div class="actions">
        <button class="btn-copy" onclick="copyPost(${i})">Copiar post</button>
        <button class="btn-tags" onclick="copyTags(${i})">Copiar hashtags</button>
        <button class="btn-review" onclick="setStatus(${i},'Reviewed')">Revisado</button>
        <button class="btn-sched" onclick="setStatus(${i},'Scheduled')">Programado</button>
        <button class="btn-pub" onclick="setStatus(${i},'Published')">Publicado</button>
        <button class="btn-reset" onclick="setStatus(${i},'Draft')">Reset</button>
      </div>

      <textarea class="note-input" placeholder="Notas..." rows="2"
        id="note-${i}"
        onchange="saveNote(${i}, this.value)">${escHtml(ps.note)}</textarea>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

window.toggleExpand = function(i) {
  document.getElementById('body-' + i)?.classList.toggle('expanded');
};

window.copyPost = function(i) {
  copyText(buildPostText(POSTS[i]), 'post completo');
};

window.copyTags = function(i) {
  copyText(POSTS[i].hashtags, 'hashtags');
};

window.setStatus = function(i, status) {
  setPostField(i, 'status', status);
  const card = document.getElementById('card-' + i);
  if (card) {
    card.className = 'card ' + status.toLowerCase();
    const badge = document.getElementById('badge-status-' + i);
    if (badge) {
      badge.className = 'badge badge-status-' + status.toLowerCase();
      badge.textContent = status;
    }
  }
  renderStats(currentFiltered());
  showToast(`Estado → ${status}`);
};

window.saveNote = function(i, value) {
  setPostField(i, 'note', value);
};

// ── Filters ───────────────────────────────────────────────────────────────────
function currentFiltered() {
  const statusF   = document.getElementById('filterStatus').value;
  const categoryF = document.getElementById('filterCategory').value;
  const formatF   = document.getElementById('filterFormat').value;
  const query     = document.getElementById('search').value.toLowerCase().trim();

  return POSTS.map((p, i) => ({ p, i })).filter(({ p, i }) => {
    const ps = getPostState(i);
    if (statusF   && ps.status !== statusF) return false;
    if (categoryF && p.category !== categoryF) return false;
    if (formatF   && p.format !== formatF) return false;
    if (query && !`${p.hook} ${p.body} ${p.category}`.toLowerCase().includes(query)) return false;
    return true;
  });
}

function applyFilters() {
  const filtered = currentFiltered();
  renderStats(filtered);
  renderGrid(filtered);
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  // Populate category filter
  const cats = [...new Set(POSTS.map(p => p.category))].sort();
  const sel = document.getElementById('filterCategory');
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });

  document.getElementById('filterStatus').addEventListener('change', applyFilters);
  document.getElementById('filterCategory').addEventListener('change', applyFilters);
  document.getElementById('filterFormat').addEventListener('change', applyFilters);
  document.getElementById('search').addEventListener('input', applyFilters);

  applyFilters();
})();
</script>
